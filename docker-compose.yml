name: wbs-dev

networks:
  default:
    name: wbs-dev
    external: true

services:
  runner:
    image: ${WBS_BUILD_TOOLS_IMAGE:-wbs-build-tools:latest}
    scale: 0
    build:
      context: .
    stop_grace_period: 1s
    ports:
      - 9229:9229
      - 4211:4211
    volumes:
      - .:/workspace:z
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    env_file:
      - test/test-runner.env
      - local.env
    environment:
      HOST_PWD: $PWD
      BUILD_CACHE_PUSH: ${BUILD_CACHE_PUSH:-false}
      BUILD_CACHE_REGISTRY: ${BUILD_CACHE_REGISTRY:-}
      BUILD_CACHE_SCOPE: ${BUILD_CACHE_SCOPE:-}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN:-}
      GITHUB_ACTIONS: ${GITHUB_ACTIONS:-false}
      GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME:-}
      GITHUB_REF: ${GITHUB_REF:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      GITHUB_REPOSITORY_OWNER: ${GITHUB_REPOSITORY_OWNER:-}
      GITHUB_RUN_ID: ${GITHUB_RUN_ID:-}
      GITHUB_SHA: ${GITHUB_SHA:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      WBS_GHCR_TOKEN: ${WBS_GHCR_TOKEN:-}
      WBS_TEST_IMAGE_REGISTRY: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}
      WBS_TEST_IMAGE_TAG: ${WBS_TEST_IMAGE_TAG:-latest}
