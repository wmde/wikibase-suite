name: wbs-deploy

services:
  # --------------------------------------------------
  # A. CORE WIKIBASE SUITE SERVICES
  # --------------------------------------------------

  wikibase:
    image: wikibase/wikibase:8
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./config:/config:z
      - ./config/extensions:/var/www/html/extensions/extensions:z
      - wikibase-image-data:/var/www/html/images
      - quickstatements-data:/quickstatements/data
      # The QLever export endpoint reads this internal credential on every
      # request. The updater creates it as root:33 with mode 0640 in query-data.
      - query-data:/qlever-data:ro
    env_file:
      - ${WBS_DIR:-.}/.wbs/version
    environment:
      METADATA_CALLBACK: ${METADATA_CALLBACK}
      MW_ADMIN_NAME: ${MW_ADMIN_NAME}
      MW_ADMIN_PASS: ${MW_ADMIN_PASS}
      MW_ADMIN_EMAIL: ${MW_ADMIN_EMAIL}
      MW_WG_SERVER: https://${WIKIBASE_PUBLIC_HOST}
      DB_SERVER: mysql:3306
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      ELASTICSEARCH_HOST: elasticsearch
      QUICKSTATEMENTS_PUBLIC_URL: https://${WIKIBASE_PUBLIC_HOST}/tools/quickstatements
      WDQS_PUBLIC_ENDPOINT_URL: https://${WDQS_PUBLIC_HOST}/sparql
      WDQS_PUBLIC_FRONTEND_URL: https://${WDQS_PUBLIC_HOST}
      WIKIMEDIA_OAUTH_CONSUMER_TOKEN: ${WIKIMEDIA_OAUTH_CONSUMER_TOKEN:-}
      WIKIMEDIA_OAUTH_SECRET_TOKEN: ${WIKIMEDIA_OAUTH_SECRET_TOKEN:-}
      QLEVER_EXPORT_TOKEN_FILE: /qlever-data/qlever-export-token
    healthcheck:
      test: curl --silent --fail localhost/wiki/Main_Page
      interval: 10s
      start_period: 5m

  wikibase-jobrunner:
    image: wikibase/wikibase:8
    command: jobrunner
    environment:
      WIKIMEDIA_OAUTH_CONSUMER_TOKEN: ${WIKIMEDIA_OAUTH_CONSUMER_TOKEN:-}
      WIKIMEDIA_OAUTH_SECRET_TOKEN: ${WIKIMEDIA_OAUTH_SECRET_TOKEN:-}
    depends_on:
      wikibase:
        condition: service_healthy
    restart: unless-stopped
    volumes_from:
      - wikibase

  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_RANDOM_ROOT_PASSWORD: yes
    healthcheck:
      test: healthcheck.sh --connect --innodb_initialized
      start_period: 1m
      interval: 20s
      timeout: 5s

  # --------------------------------------------------
  # B. EXTRA WIKIBASE SUITE SERVICES
  # --------------------------------------------------

  # To disable OpenSearch and use default MediaWiki search functionality, remove
  # the elasticsearch service and the ELASTICSEARCH_HOST variable from wikibase.
  # The legacy service name is retained for existing generated LocalSettings.php files.
  elasticsearch:
    image: wikibase/opensearch:1
    restart: unless-stopped
    volumes:
      # Retain this legacy volume name so existing installations keep their search data.
      - elasticsearch-data:/usr/share/opensearch/data
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: curl --silent --fail localhost:9200
      interval: 10s
      start_period: 2m

  # Runtime only. Development/test Compose overlays provide the separate full
  # export and index workflow until supported user-facing bootstrap exists.
  query:
    image: wikibase/qlever:0.1.0
    working_dir: /data
    command: ["server"]
    restart: unless-stopped
    volumes:
      - query-data:/data
    healthcheck:
      test: curl --silent --fail http://localhost:7001/ping
      interval: 10s
      start_period: 2m

  query-updater:
    image: wikibase/qlever-updater:0.1.0
    depends_on:
      wikibase:
        condition: service_healthy
      query:
        condition: service_healthy
    restart: unless-stopped
    environment:
      WIKIBASE_URL: http://wikibase
      WIKIBASE_RDF_BASE: https://${WIKIBASE_PUBLIC_HOST}
      QLEVER_URL: http://query:7001
      QLEVER_EXPORT_TOKEN_FILE: /data/qlever-export-token
    volumes:
      - query-data:/data
    healthcheck:
      test: >-
        php -r '$$f="/data/qlever-updater-health.json"; exit(is_file($$f) && time() - filemtime($$f) < 90 ? 0 : 1);'
      interval: 15s
      timeout: 5s
      start_period: 2m

  query-ui:
    image: wikibase/wdqs-frontend:2
    depends_on:
      query:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./config:/config:z
    environment:
      WDQS_PUBLIC_URL: https://${WDQS_PUBLIC_HOST}/sparql
      WIKIBASE_PUBLIC_URL: https://${WIKIBASE_PUBLIC_HOST}/w/api.php
    healthcheck:
      test: curl --silent --fail localhost
      interval: 10s
      start_period: 2m

  quickstatements:
    image: wikibase/quickstatements:1
    depends_on:
      wikibase:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - quickstatements-data:/quickstatements/data
    environment:
      QUICKSTATEMENTS_PUBLIC_URL: https://${WIKIBASE_PUBLIC_HOST}/tools/quickstatements
      WIKIBASE_PUBLIC_URL: https://${WIKIBASE_PUBLIC_HOST}
    healthcheck:
      test: curl --silent --fail localhost
      interval: 10s
      start_period: 2m

  # --------------------------------------------------
  # C. REVERSE PROXY AND SSL SERVICES
  # --------------------------------------------------

  # This is the reverse proxy and SSL service
  traefik:
    image: traefik:3
    command:
      # traefik static configuration via command line
      # enable accesslog
      - "--accesslog.format=common"
      # http endpoint
      - "--entrypoints.web.address=:80"
      # https endpoint
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.asdefault"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      # http to https redirect
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # ACME SSL certificate generation
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${MW_ADMIN_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # additionial traefik dynamic configuration via config file
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      # Uncomment this line to only test ssl generation first, makes sure you don't run into letsencrypt rate limits
      # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      # Uncomment the following line for debugging, also expose port 8080 below
      # - "--api.dashboard=true"
      # - "--api.insecure=true"
      # - "--log.level=DEBUG"
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      # traefik dashboard
      # - 8080:8080
    volumes:
      - ./config/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-letsencrypt-data:/letsencrypt
    environment:
      WIKIBASE_PUBLIC_HOST: ${WIKIBASE_PUBLIC_HOST}
      WDQS_PUBLIC_HOST: ${WDQS_PUBLIC_HOST}

volumes:
  # A. CORE WIKIBASE SUITE SERVICES DATA
  wikibase-image-data:
  mysql-data:
  # B. EXTRA WIKIBASE SUITE SERVICES DATA
  query-data:
  elasticsearch-data:
  quickstatements-data:
  # C. REVERSE PROXY AND SSL SERVICES DATA
  traefik-letsencrypt-data:
