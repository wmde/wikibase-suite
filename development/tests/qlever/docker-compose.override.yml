# Development-only full export and reindex fixture. It is intentionally not
# part of the root Suite runtime Compose file.
services:
  # The bounded export API authenticates using the same token that the
  # bootstrapper creates in query-data. The generic test overlay replaces the
  # Wikibase volume list, so restore this production mount here.
  wikibase:
    volumes:
      - query-data:/qlever-data:ro
      - ./qlever/LocalSettings.php:/test-settings/LocalSettings.php:ro

  # Test Wikibase is served over HTTP. Keep transformed metadata on the same
  # entity IRIs as the RDF snapshot rather than inheriting production's HTTPS
  # public-base default.
  wdqs-qlever-updater:
    environment:
      WIKIBASE_RDF_BASE: ${WIKIBASE_URL}

  query-bootstrap:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wdqs-qlever-updater:${WBS_TEST_IMAGE_TAG:-latest}
    command: ["bootstrap"]
    depends_on:
      wikibase:
        condition: service_healthy
    restart: "no"
    volumes:
      - query-data:/data
    environment:
      WIKIBASE_URL: http://wikibase
      WIKIBASE_RDF_BASE: ${WIKIBASE_URL}
      QLEVER_EXPORT_TOKEN_FILE: /data/qlever-export-token
      BOOTSTRAP_FORCE: "true"
      # A one-entity chunk makes the cutover test long enough to inject an
      # edit after the export high-water mark has been captured.
      QLEVER_EXPORT_CHUNK_SIZE: "1"

  query-indexer:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/qlever:${WBS_TEST_IMAGE_TAG:-latest}
    command: ["index"]
    working_dir: /data
    depends_on:
      query-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    volumes:
      - query-data:/data

  qlever:
    depends_on: !override
      query-indexer:
        condition: service_completed_successfully
        restart: true
