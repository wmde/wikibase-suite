name: wbs-dev-test-services

networks:
  default:
    name: wbs-dev
    external: true

services:
  wikibase:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wikibase:${WBS_TEST_IMAGE_TAG:-latest}
    depends_on: !override
      mysql:
        condition: service_healthy
    volumes:
      - ./${WBS_TEST_CONFIG_DIR}:/config
      - wikibase-extensions:/var/www/html/extensions/extensions
      - ./${OUTPUT_DIR}:/var/log/mediawiki
    environment:
      ELASTICSEARCH_HOST: !reset null
      MW_WG_SERVER: ${WIKIBASE_URL}
      QUICKSTATEMENTS_PUBLIC_URL: ${QUICKSTATEMENTS_URL}
      WDQS_PUBLIC_FRONTEND_URL: http://${WDQS_PUBLIC_HOST}
      WDQS_PUBLIC_ENDPOINT_URL: http://${WDQS_PUBLIC_HOST}/sparql
      WIKIMEDIA_OAUTH_CONSUMER_TOKEN: test-wikimedia-consumer-token
      WIKIMEDIA_OAUTH_SECRET_TOKEN: test-wikimedia-secret-token

  wikibase-jobrunner:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wikibase:${WBS_TEST_IMAGE_TAG:-latest}

  elasticsearch:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/opensearch:${WBS_TEST_IMAGE_TAG:-latest}
    profiles: [ opensearch ]

  query:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/qlever:${WBS_TEST_IMAGE_TAG:-latest}
    profiles: [ qlever ]

  query-updater:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/qlever-updater:${WBS_TEST_IMAGE_TAG:-latest}
    profiles: [ qlever ]

  query-ui:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wdqs-frontend:${WBS_TEST_IMAGE_TAG:-latest}
    profiles: [ qlever, queryservice ]
    volumes:
      - ./${WBS_TEST_CONFIG_DIR}:/config
    environment:
      WDQS_PUBLIC_URL: http://${WDQS_PUBLIC_HOST}/sparql
      WIKIBASE_PUBLIC_URL: http://${WIKIBASE_PUBLIC_HOST}/w/api.php

  quickstatements:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/quickstatements:${WBS_TEST_IMAGE_TAG:-latest}
    profiles: [ quickstatements ]
    environment:
      WIKIBASE_PUBLIC_URL: ${WIKIBASE_URL}
      QUICKSTATEMENTS_PUBLIC_URL: ${QUICKSTATEMENTS_URL}

  browser:
    image: ${TEST_BROWSER_IMAGE_URL}
    stop_grace_period: 1s
    ports:
      - 4444:4444
      - 5900:5900
      - 7900:7900
    volumes:
      # Should map to the same location as the wbs-dev workspace root
      - ../../:/workspace
    shm_size: 2g
    environment:
      SE_NODE_MAX_SESSIONS: ${MAX_INSTANCES}
      SE_VNC_NO_PASSWORD: 1

  traefik:
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.asdefault"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
    ports: !override
      - 8081:80
    volumes:
      - ../../config/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      default:
        aliases:
          - ${WIKIBASE_PUBLIC_HOST}
          - ${WDQS_PUBLIC_HOST}

volumes:
  wikibase-extensions:
