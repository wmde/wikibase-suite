networks:
  browser-test:
    name: wbs-dev
    external: true

services:
  wikibase:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wikibase:${WBS_TEST_IMAGE_TAG:-latest}
    pull_policy: ${WBS_E2E_PULL_POLICY:-never}

  wikibase-jobrunner:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wikibase:${WBS_TEST_IMAGE_TAG:-latest}
    pull_policy: ${WBS_E2E_PULL_POLICY:-never}

  elasticsearch:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/opensearch:${WBS_TEST_IMAGE_TAG:-latest}
    pull_policy: ${WBS_E2E_PULL_POLICY:-never}

  wdqs:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wdqs:${WBS_TEST_IMAGE_TAG:-latest}
    pull_policy: ${WBS_E2E_PULL_POLICY:-never}

  wdqs-updater:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wdqs:${WBS_TEST_IMAGE_TAG:-latest}
    pull_policy: ${WBS_E2E_PULL_POLICY:-never}

  wdqs-frontend:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wdqs-frontend:${WBS_TEST_IMAGE_TAG:-latest}
    pull_policy: ${WBS_E2E_PULL_POLICY:-never}

  quickstatements:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/quickstatements:${WBS_TEST_IMAGE_TAG:-latest}
    pull_policy: ${WBS_E2E_PULL_POLICY:-never}

  traefik:
    ports: !override
      - "${WBS_E2E_HTTP_PORT:-18080}:80"
      - "${WBS_E2E_HTTPS_PORT:-18443}:443"
    networks:
      default:
      browser-test:
        aliases:
          - wikibase.test
          - query.wikibase.test
