networks:
  browser-test:
    name: wbs-dev
    external: true

services:
  traefik:
    ports: !override
      - "${WBS_E2E_HTTP_PORT:-18080}:80"
      - "${WBS_E2E_HTTPS_PORT:-18443}:443"
    networks:
      default:
      browser-test:
        aliases:
          - wikibase.test
          - query.wikibase.test
