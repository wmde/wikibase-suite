name: wbs-dev-test-services

networks:
  default:
    name: wbs-dev
    external: true

services:
  wikibase:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wikibase:${WBS_TEST_IMAGE_TAG:-latest}
    depends_on: !override
      mysql:
        condition: service_healthy
    volumes:
      - wikibase-config:/config
      - wikibase-extensions:/var/www/html/extensions/extensions
      - ./LocalSettings.override.php:/var/www/html/LocalSettings.d/LocalSettings.override.php
      - ./empty.php:/var/www/html/LocalSettings.d/90_UserDefinedExtensions.php
      - ../${OUTPUT_DIR}:/var/log/mediawiki
    environment:
      ELASTICSEARCH_HOST: !reset null
      MW_WG_SERVER: ${WIKIBASE_URL}
      QUICKSTATEMENTS_PUBLIC_URL: ${QUICKSTATEMENTS_URL}
      WDQS_PUBLIC_FRONTEND_URL: http://${WDQS_PUBLIC_HOST}
      WDQS_PUBLIC_ENDPOINT_URL: http://${WDQS_PUBLIC_HOST}/sparql
      WIKIMEDIA_OAUTH_CONSUMER_KEY: test-wikimedia-consumer-key
      WIKIMEDIA_OAUTH_CONSUMER_SECRET: test-wikimedia-consumer-secret

  wikibase-jobrunner:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wikibase:${WBS_TEST_IMAGE_TAG:-latest}

  elasticsearch:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/elasticsearch:${WBS_TEST_IMAGE_TAG:-latest}
    profiles: [ elasticsearch ]

  wdqs:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wdqs:${WBS_TEST_IMAGE_TAG:-latest}
    profiles: [ queryservice ]

  wdqs-updater:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wdqs:${WBS_TEST_IMAGE_TAG:-latest}
    profiles: [ queryservice ]
    environment:
      WIKIBASE_CONCEPT_URI: http://${WIKIBASE_PUBLIC_HOST}

  wdqs-frontend:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/wdqs-frontend:${WBS_TEST_IMAGE_TAG:-latest}
    profiles: [ queryservice ]
    volumes:
      - wdqs-frontend-config:/config
    environment:
      WDQS_PUBLIC_URL: http://${WDQS_PUBLIC_HOST}/sparql
      WIKIBASE_PUBLIC_URL: http://${WIKIBASE_PUBLIC_HOST}/w/api.php

  quickstatements:
    image: ${WBS_TEST_IMAGE_REGISTRY:-wikibase}/quickstatements:${WBS_TEST_IMAGE_TAG:-latest}
    profiles: [ quickstatements ]
    environment:
      WIKIBASE_PUBLIC_URL: ${WIKIBASE_URL}
      QUICKSTATEMENTS_PUBLIC_URL: ${QUICKSTATEMENTS_URL}

  browser:
    image: ${TEST_BROWSER_IMAGE_URL}
    stop_grace_period: 1s
    ports:
      - 4444:4444
      - 5900:5900
      - 7900:7900
    volumes:
      # Should map to the same location as the build-tools workspace root
      - ../../:/workspace
    shm_size: 2g
    environment:
      SE_NODE_MAX_SESSIONS: ${MAX_INSTANCES}
      SE_VNC_NO_PASSWORD: 1

  traefik:
    command:
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.asdefault"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
    ports: !override
      - 8081:80
    volumes:
      - ../../deploy/config/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      default:
        aliases:
          - ${WIKIBASE_PUBLIC_HOST}
          - ${WDQS_PUBLIC_HOST}

volumes:
  wikibase-config:
  wdqs-frontend-config:
  wikibase-extensions:
