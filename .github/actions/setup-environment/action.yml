name: "Setup Docker registry access"
description: "Authenticate host and containerized builds with Docker registries"
inputs:
  github_token:
    description: token to access GHCR
    required: true
  dockerhub_token:
    description: token to access dockerhub
    required: true
  qemu_platforms:
    description: comma-separated non-native platforms to enable when a build requests them
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup QEMU for a multi-platform build
      if: inputs.qemu_platforms != ''
      uses: docker/setup-qemu-action@v3
      with:
        platforms: ${{ inputs.qemu_platforms }}

    - name: Login to Dockerhub Container Registry (to increase rate limit)
      uses: docker/login-action@v3
      with:
        # implicitly docker hub
        username: wmdetravisbot
        password: ${{ inputs.dockerhub_token }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.github_token }}

    - name: Forward registry credentials to build tools
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.github_token }}
        DOCKERHUB_TOKEN: ${{ inputs.dockerhub_token }}
      run: |
        echo "WBS_GHCR_TOKEN=$GHCR_TOKEN" >> "$GITHUB_ENV"
        echo "DOCKERHUB_TOKEN=$DOCKERHUB_TOKEN" >> "$GITHUB_ENV"
