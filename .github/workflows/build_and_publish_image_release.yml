name: 📦 Build and Publish a WBS Image Release to Dockerhub

on:
  push:
    tags:
      - 'opensearch@*'
      - 'quickstatements@*'
      - 'wbs-tools@*'
      - 'wdqs@*'
      - 'wdqs-frontend@*'
      - 'wikibase@*'

permissions:
  contents: write
  packages: write

jobs:
  build_and_test:
    uses: ./.github/workflows/_build_and_test.yml
    secrets: inherit

  extract_tag_and_publish:
    needs: build_and_test
    if: needs.build_and_test.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Extract image name and confirm it is a valid semantic version tag
        id: extract_tag
        run: |
          set -x # show commands

          # Extract the tag name
          TAG_NAME=$(echo ${{ github.ref }} | sed 's/refs\/tags\///')

          # Prerelease publication is intentionally unsupported for now.
          if [[ "$TAG_NAME" =~ ^([^@]+)@([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            # Store image name in environment for later steps
            echo "IMAGE_NAME=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          else
            echo "Tag does not match the stable pattern {imageName}@{MAJOR.MINOR.PATCH}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-environment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub_token: ${{ secrets.WBS_PUBLISH_TOKEN }}

      - name: Build image and push to Dockerhub with release tags
        env:
          BUILD_CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}/wikibase
          BUILD_CACHE_PUSH: "true"
        run: |
          set -e # abort on error
          set -x # show commands

          ./wbs-dev build "$IMAGE_NAME" --publish
        working-directory: development

      - name: Publish image documentation to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: wmdetravisbot
          password: ${{ secrets.WBS_PUBLISH_TOKEN }}
          repository: wikibase/${{ env.IMAGE_NAME }}
          readme-filepath: docker-images/${{ env.IMAGE_NAME }}/README.md
