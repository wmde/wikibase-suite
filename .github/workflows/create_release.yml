name: Create a Release

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Release target'
        type: choice
        required: true
        default: 'wikibase'
        options:
          - wbs
          - opensearch
          - quickstatements
          - qlever
          - qlever-updater
          - wbs-tools
          - wdqs
          - wdqs-frontend
          - wikibase
          - All projects
      dry_run:
        description: 'Validate and preview the release without creating tags.'
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build_and_test:
    uses: ./.github/workflows/build_and_test.yml
    with:
      build_arm64: ${{ vars.WBS_RELEASE_ARM64 == 'true' }}
      test_arm64: ${{ vars.WBS_RELEASE_ARM64 == 'true' }}
    secrets: inherit

  release:
    needs: build_and_test
    if: needs.build_and_test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0
          token: ${{ secrets.GH_WBS_BOT_TOKEN }}

      - uses: ./.github/actions/setup-environment
        with:
          github_token: ${{ secrets.GH_WBS_BOT_TOKEN }}
          dockerhub_token: ${{ secrets.WBS_PUBLISH_TOKEN }}

      - name: Validate and publish the selected release
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        working-directory: development
        run: |
          set -euo pipefail

          case "$PROJECT_NAME" in
            wbs)
              release_target=(wbs)
              ;;
            "All projects")
              release_target=(all)
              ;;
            opensearch|qlever|qlever-updater|quickstatements|wbs-tools|wdqs|wdqs-frontend|wikibase)
              release_target=(images "$PROJECT_NAME")
              ;;
            *)
              echo "Unknown release target: $PROJECT_NAME"
              exit 1
              ;;
          esac

          release_options=()
          if [ "$DRY_RUN" = "true" ]; then
            release_options+=(--dry-run)
          fi

          ./wbs-dev release "${release_target[@]}" "${release_options[@]}"
