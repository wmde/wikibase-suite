name: Create a Release

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Space-separated image names, wbs, or all.'
        type: string
        required: true
        default: all
      dry_run:
        description: 'Run preflight only; do not build or publish.'
        type: boolean
        required: true
        default: false

permissions:
  actions: write
  contents: write
  packages: write

# Serialize release publication, including updates to rolling image aliases.
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.preflight.outputs.images }}
    steps:
      - name: Validate release branch
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/heads/release/wbs-[0-9]+$ ]]; then
            echo "::error::Run Create a Release from a release/wbs-X branch."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_WBS_BOT_TOKEN }}
      - uses: ./.github/actions/setup-environment
        with:
          github_token: ${{ secrets.GH_WBS_BOT_TOKEN }}
          dockerhub_token: ${{ secrets.WBS_PUBLISH_TOKEN }}
      - name: Validate release targets
        id: preflight
        working-directory: development
        env:
          RELEASE_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          read -r -a targets <<< "$RELEASE_TARGETS"
          if [[ ${#targets[@]} == 0 ]]; then targets=(all); fi
          ./wbs-dev release "${targets[@]}" --preflight
          images=$(./wbs-dev build --list=json)
          selected=$(printf '%s\n' "${targets[@]}" | jq -R . | jq -s .)
          images=$(jq -c --argjson selected "$selected" \
            '[.[] | select(($selected | index("all")) or (. as $name | $selected | index($name)))]' <<< "$images")
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build_and_test:
    needs: preflight
    if: inputs.dry_run != true
    uses: ./.github/workflows/build_and_test.yml
    with:
      force_build: true
      build_arm64: ${{ vars.WBS_RELEASE_ARM64 == 'true' }}
      test_arm64: ${{ vars.WBS_RELEASE_ARM64 == 'true' }}
    secrets: inherit

  publish:
    needs: build_and_test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_WBS_BOT_TOKEN }}
      - uses: ./.github/actions/setup-environment
        with:
          github_token: ${{ secrets.GH_WBS_BOT_TOKEN }}
          dockerhub_token: ${{ secrets.WBS_PUBLISH_TOKEN }}
      - name: Publish tested images and Git tags
        working-directory: development
        env:
          RELEASE_TARGETS: ${{ inputs.targets }}
          IMAGE_TAG: ${{ needs.build_and_test.outputs.image_tag }}
          STAGING_REGISTRY: ghcr.io/${{ github.repository_owner }}/wikibase
        run: |
          set -euo pipefail
          read -r -a targets <<< "$RELEASE_TARGETS"
          if [[ ${#targets[@]} == 0 ]]; then targets=(all); fi
          ./wbs-dev release "${targets[@]}" --publish \
            --staging-registry "$STAGING_REGISTRY" --image-tag "$IMAGE_TAG"

  documentation:
    needs: [preflight, publish]
    if: needs.preflight.outputs.images != '[]'
    uses: ./.github/workflows/publish_image_documentation.yml
    with:
      images: ${{ needs.preflight.outputs.images }}
    secrets: inherit
