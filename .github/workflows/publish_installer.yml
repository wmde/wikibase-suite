name: Publish Installer

on:
  pull_request_target:
    types:
      - closed
  push:
    tags:
      - 'wbs@*'
  workflow_dispatch:
    inputs:
      target:
        description: 'PR (pr-942), branch (branch:release/wbs-8), or WBS tag.'
        type: string
        required: true
      commit:
        description: 'Source commit for a complete preview build.'
        type: string
        required: false
      build_tag:
        description: 'CI image set tag (dev-RUN-ATTEMPT) for a preview build.'
        type: string
        required: false

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: installer-${{ github.event.pull_request.number || inputs.target || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-manual-target:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate publication target
        env:
          TARGET: ${{ inputs.target }}
          COMMIT: ${{ inputs.commit }}
          BUILD_TAG: ${{ inputs.build_tag }}
        run: |
          if [[ ! "$TARGET" =~ ^(pr-[1-9][0-9]*|branch:(main|release/wbs-[1-9][0-9]*)|wbs@[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid publication target: $TARGET." >&2
            exit 1
          fi
          if [[ "$TARGET" != wbs@* ]]; then
            [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$BUILD_TAG" =~ ^dev-[1-9][0-9]*-[1-9][0-9]*$ ]] || {
              echo 'Preview publication requires a commit and complete CI build tag.' >&2
              exit 1
            }
          elif [[ -n "$COMMIT" || -n "$BUILD_TAG" ]]; then
            echo 'Release publication does not take a CI preview commit or build tag.' >&2
            exit 1
          fi

  cleanup-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR-close event must only run trusted cleanup code from the base branch.
          ref: ${{ github.event.repository.default_branch }}

      - name: Remove PR installer publications
        env:
          GH_TOKEN: ${{ secrets.GH_WBS_BOT_TOKEN }}
          ORIGIN_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/publish-installer.sh cleanup-pr

  publish-preview:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.build_tag != '' &&
      (startsWith(inputs.target, 'pr-') || startsWith(inputs.target, 'branch:'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The privileged publisher always runs trusted default-branch code.
          ref: ${{ github.event.repository.default_branch }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish complete preview image set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORIGIN_REPOSITORY: ${{ github.repository }}
          PREVIEW_TARGET: ${{ inputs.target }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          BUILD_TAG: ${{ inputs.build_tag }}
        run: .github/scripts/publish-installer.sh prepare-preview
      - name: Publish preview installer
        env:
          GH_TOKEN: ${{ secrets.GH_WBS_BOT_TOKEN }}
        run: .github/scripts/publish-installer.sh dispatch-preview
      - name: Summarize preview installer
        run: |
          payload="$RUNNER_TEMP/wikibase-suite-installer/preview-dispatch.json"
          if [[ "$(jq -r '.client_payload.pr // 0' "$payload")" != 0 ]]; then
            alias="pr-$(jq -r '.client_payload.pr' "$payload")"
          else
            alias="branch-$(jq -r '.client_payload.branch | gsub("/"; "-")' "$payload")"
          fi
          pinned="$alias-$(jq -r '.client_payload.commit[0:12]' "$payload")-$(jq -r '.client_payload.buildId' "$payload")"
          {
            echo '### Preview installer'
            echo
            echo "Pinned build: https://wmde.github.io/wikibase-suite-install/$pinned"
            echo "Moving link: https://wmde.github.io/wikibase-suite-install/$alias"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    if: >-
      (
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/wbs@')
      ) || (
        github.event_name == 'workflow_dispatch' &&
        startsWith(inputs.target, 'wbs@')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'push' && github.ref || inputs.target }}

      - name: Publish release installer
        env:
          GH_TOKEN: ${{ secrets.GH_WBS_BOT_TOKEN }}
          ORIGIN_REPOSITORY: ${{ github.repository }}
        run: .github/scripts/publish-installer.sh publish-release
