name: Publish Installer

on:
  workflow_run:
    workflows:
      - "Build and Test"
    types:
      - completed
  pull_request_target:
    types:
      - closed
  push:
    tags:
      - 'wbs@*'
  workflow_dispatch:
    inputs:
      target:
        description: 'PR number (pr-942) or WBS tag (wbs@8.0.0) to republish.'
        type: string
        required: true

permissions:
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: installer-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.ref_name || inputs.target || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-manual-target:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate publication target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [[ ! "$TARGET" =~ ^(pr-[1-9][0-9]*|wbs@[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected a target such as pr-942 or wbs@8.0.0; received $TARGET." >&2
            exit 1
          fi

  cleanup-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR-close event must only run trusted cleanup code from the base branch.
          ref: ${{ github.event.repository.default_branch }}

      - name: Remove PR installer publications
        env:
          GH_TOKEN: ${{ secrets.GH_WBS_BOT_TOKEN }}
          ORIGIN_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/publish-installer.sh cleanup-pr

  publish-pr:
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].number != null
      ) || (
        github.event_name == 'workflow_dispatch' &&
        startsWith(inputs.target, 'pr-')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Deliberately use trusted publisher code, never code from the PR.
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve pull request publication
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATIC_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          # The PR entry may have advanced since this workflow run completed.
          AUTOMATIC_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_run' ]]; then
            pr_number="$AUTOMATIC_PR_NUMBER"
            head_sha="$AUTOMATIC_HEAD_SHA"
          else
            pr_number="${MANUAL_TARGET#pr-}"
            pull_request="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
            head_sha="$(jq -r '.head.sha' <<< "$pull_request")"
          fi
          {
            echo "number=$pr_number"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish coordinated PR images
        env:
          ORIGIN_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-installer.sh prepare-pr

      - name: Dispatch PR installer publication
        env:
          GH_TOKEN: ${{ secrets.GH_WBS_BOT_TOKEN }}
        run: .github/scripts/publish-installer.sh dispatch-pr

      - name: Summarize PR installer
        id: installer
        env:
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.head_sha }}
        run: |
          short_sha="${PR_HEAD_SHA:0:12}"
          payload="$RUNNER_TEMP/wikibase-suite-installer/pr-dispatch.json"
          if [[ ! -s "$payload" ]]; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
            echo 'No PR installer was published by this run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          current="$(jq -r '.client_payload.current' "$payload")"
          if [[ "$current" == true ]]; then
            installer_url="https://wmde.github.io/wikibase-suite-install/pr-${PR_NUMBER}"
          else
            installer_url="https://wmde.github.io/wikibase-suite-install/pr-${PR_NUMBER}-${short_sha}"
          fi
          {
            echo 'published=true'
            echo "current=$current"
            echo "url=$installer_url"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Wikibase Suite PR installer'
            echo
            echo 'Use this installer URL instead of the one in the published documentation to test this PR:'
            echo
            echo '```sh'
            echo "curl -fsSL $installer_url | bash"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR installer
        if: >-
          steps.installer.outputs.published == 'true' &&
          steps.installer.outputs.current == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER_URL: ${{ steps.installer.outputs.url }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: |
          marker='<!-- wikibase-suite-pr-installer -->'
          body="$(printf '%s\n' \
            "$marker" \
            '### Test this PR installer' \
            '' \
            'Use this command instead of the installer command in the published documentation:' \
            '' \
            '```sh' \
            "curl -fsSL $INSTALLER_URL | bash" \
            '```' \
            '' \
            'This URL tracks the latest successfully published source and image build for this PR.')"
          comment_id="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- wikibase-suite-pr-installer -->")) | .id' |
              tail -n 1
          )"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$body"
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body"
          fi

  publish-release:
    if: >-
      (
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/wbs@')
      ) || (
        github.event_name == 'workflow_dispatch' &&
        startsWith(inputs.target, 'wbs@')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'push' && github.ref || inputs.target }}

      - name: Publish release installer
        env:
          GH_TOKEN: ${{ secrets.GH_WBS_BOT_TOKEN }}
          ORIGIN_REPOSITORY: ${{ github.repository }}
        run: .github/scripts/publish-installer.sh publish-release
