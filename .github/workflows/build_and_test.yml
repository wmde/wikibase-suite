name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/wbs-*'
  workflow_dispatch:
    inputs:
      build_arm64:
        description: Build and assemble CI images for AMD64 and ARM64.
        type: boolean
        required: true
        default: false
      test_arm64:
        description: Run every test suite against the ARM64 image set too.
        type: boolean
        required: true
        default: false
  workflow_call:
    outputs:
      image_tag:
        description: Image tag from this build, including only tested architectures.
        value: ${{ (inputs.test_arm64 || vars.WBS_RELEASE_ARM64 == 'true') && jobs.setup.outputs.image_tag || format('{0}-amd64', jobs.setup.outputs.image_tag) }}
    inputs:
      force_build:
        description: Run the full gate even if an earlier workflow could justify skipping.
        type: boolean
        required: false
        default: false
      build_arm64:
        description: Build native ARM64 images and include them in CI manifests.
        type: boolean
        required: false
        default: false
      test_arm64:
        description: Run every integration suite against the native ARM64 images.
        type: boolean
        required: false
        default: false

permissions:
  actions: write
  contents: read
  packages: write

env:
  BUILD_CACHE_REGISTRY: ghcr.io/${{ github.repository_owner }}/wikibase
  BUILD_CACHE_PUSH: "true"
  CI_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/wikibase

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      images: ${{ steps.targets.outputs.images }}
      test_targets: ${{ steps.targets.outputs.test_targets }}
      image_tag: ${{ steps.targets.outputs.image_tag }}
    steps:
      - name: Check for duplicate successful runs
        id: skip_check
        if: inputs.force_build != true
        uses: fkirc/skip-duplicate-actions@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          paths_ignore: '["docs/**", "development/docs/**", "**/README.md", "**/CHANGELOG.md", "**/UPDATING.md"]'
          skip_after_successful_duplicate: true
          cancel_others: true
          # Release gates always run. Reusing earlier runs is a separate optimization.
          do_not_skip: '["schedule", "workflow_dispatch"]'

      - uses: actions/checkout@v4
        if: steps.skip_check.outputs.should_skip != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-environment
        if: steps.skip_check.outputs.should_skip != 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub_token: ${{ secrets.WBS_PUBLISH_TOKEN }}

      - name: List build and test targets
        if: steps.skip_check.outputs.should_skip != 'true'
        id: targets
        shell: bash
        working-directory: development
        run: |
          set -euo pipefail
          images=$(./wbs-dev build --list=json | jq -ce '.')
          test_targets=$(./wbs-dev test --list=json | jq -ce '.')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "test_targets=$test_targets" >> "$GITHUB_OUTPUT"
          echo "image_tag=dev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  lint:
    needs:
      - setup
    if: needs.setup.outputs.should_skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-environment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub_token: ${{ secrets.WBS_PUBLISH_TOKEN }}

      - run: ./wbs-dev lint
        working-directory: development

  build:
    name: build/${{ matrix.imageName }} (${{ matrix.architecture }})
    needs:
      - setup
    if: needs.setup.outputs.should_skip != 'true'
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        imageName: ${{ fromJSON(needs.setup.outputs.images) }}
        architecture: ${{ fromJSON((inputs.build_arm64 || inputs.test_arm64 || vars.WBS_RELEASE_ARM64 == 'true') && '["amd64","arm64"]' || '["amd64"]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-environment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub_token: ${{ secrets.WBS_PUBLISH_TOKEN }}
          # Two Composer source images are AMD64-only intermediate stages. All
          # final-image stages still execute natively on this ARM64 runner.
          qemu_platforms: ${{ matrix.architecture == 'arm64' && 'amd64' || '' }}

      - name: build-and-push/${{ matrix.imageName }} (${{ matrix.architecture }})
        env:
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          IMAGE_NAME: ${{ matrix.imageName }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          build_args=(
            "$IMAGE_NAME" --push --provenance=false
            --platform="linux/$ARCHITECTURE" \
            --set "$IMAGE_NAME.tags=$CI_IMAGE_REGISTRY/$IMAGE_NAME:$IMAGE_TAG-$ARCHITECTURE"
          )
          ./wbs-dev build "${build_args[@]}"
        working-directory: development

  assemble:
    name: assemble multi-platform CI images
    needs:
      - setup
      - build
    if: >-
      always() &&
      needs.setup.outputs.should_skip != 'true' &&
      (inputs.build_arm64 || inputs.test_arm64 || vars.WBS_RELEASE_ARM64 == 'true') &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-environment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub_token: ${{ secrets.WBS_PUBLISH_TOKEN }}

      - name: Assemble multi-platform manifests
        env:
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          IMAGES: ${{ needs.setup.outputs.images }}
        run: |
          set -euo pipefail
          while IFS= read -r image_name; do
            image="$CI_IMAGE_REGISTRY/$image_name"
            docker buildx imagetools create \
              --tag "$image:$IMAGE_TAG" \
              "$image:$IMAGE_TAG-amd64" \
              "$image:$IMAGE_TAG-arm64"
          done < <(jq -r '.[]' <<< "$IMAGES")

  # Publish a complete preview set as soon as every image builds. Integration
  # tests continue independently; official Docker Hub releases still require
  # the full test gate in Create a Release.
  publish-preview:
    needs:
      - setup
      - build
      - assemble
    if: >-
      always() &&
      needs.setup.outputs.should_skip != 'true' &&
      needs.build.result == 'success' &&
      (needs.assemble.result == 'success' || needs.assemble.result == 'skipped') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref_name == 'main' || startsWith(github.ref_name, 'release/wbs-'))) ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch trusted preview publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          BUILD_TAG: ${{ needs.setup.outputs.image_tag }}
        run: |
          set -euo pipefail
          # During review, the trusted default-branch publisher does not yet
          # understand preview inputs. Activate dispatch after it is merged.
          publisher_workflow="$(gh api \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/publish_installer.yml" \
            -H 'Accept: application/vnd.github.raw+json')"
          if ! grep -q 'build_tag:' <<< "$publisher_workflow"; then
            echo 'Preview dispatch activates after the trusted publisher is merged.'
            exit 0
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            target="pr-$PR_NUMBER"
          else
            target="branch:$SOURCE_BRANCH"
          fi
          gh workflow run publish_installer.yml --ref main \
            -f target="$target" -f commit="$SOURCE_COMMIT" -f build_tag="$BUILD_TAG"

  test:
    name: test/${{ matrix.target }} (${{ matrix.architecture }})
    needs:
      - setup
      - build
    if: needs.setup.outputs.should_skip != 'true'
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      WBS_TEST_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}/wikibase
      WBS_TEST_IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}-${{ matrix.architecture }}
      WBS_TEST_IMAGE_PULL_POLICY: missing

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.setup.outputs.test_targets) }}
        architecture: ${{ fromJSON((inputs.test_arm64 || vars.WBS_RELEASE_ARM64 == 'true') && '["amd64","arm64"]' || '["amd64"]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-environment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub_token: ${{ secrets.WBS_PUBLISH_TOKEN }}

      - uses: ./.github/actions/run-test-target
        with:
          target: ${{ matrix.target }}
          architecture: ${{ matrix.architecture }}

  # Stable branch-protection check covering every build-and-test job.
  test-success:
    needs:
      - setup
      - lint
      - build
      - assemble
      - test
    if: >-
      always() &&
      needs.setup.result == 'success' &&
      (
        needs.setup.outputs.should_skip == 'true' ||
        (
          needs.lint.result == 'success' &&
          needs.build.result == 'success' &&
          needs.test.result == 'success' &&
          (needs.assemble.result == 'success' || needs.assemble.result == 'skipped')
        )
      )
    runs-on: ubuntu-24.04
    steps:
      - run: echo "All required checks passed."
